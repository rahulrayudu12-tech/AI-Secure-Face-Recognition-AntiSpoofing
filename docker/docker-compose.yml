version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: auraid_postgres
    restart: always
    environment:
      POSTGRES_DB: aura_security
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_secure_password_99
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: auraid_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://aura_user:aura_secure_password_99@db:5432/aura_security
      SECRET_KEY: aura-id-production-secret-cyber-key-2026
      JWT_SECRET: aura-id-jwt-production-auth-token-key-2026
      HOST: 0.0.0.0
      PORT: 5000
    volumes:
      - ../data:/app/data
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    container_name: auraid_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
